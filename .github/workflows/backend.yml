name: Backend CI

# Sadece backend'i etkileyen değişikliklerde çalışır; mobil uygulamadaki bir değişiklik bu işi tetiklemez.
on:
  push:
    branches: [main]
    paths:
      - "dus-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "dus-backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# En az yetki: iş sadece kodu okur, repoya yazmaz, gizli anahtar kullanmaz (testlerde LLM mock'lu).
permissions:
  contents: read

# Aynı dala art arda push edilirse eski çalışma iptal edilir, sadece en yenisi tamamlanır.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dus-backend

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Production imajıyla aynı Python sürümü (Dockerfile: python:3.12-slim).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            dus-backend/requirements.txt
            dus-backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check . --output-format=github

      - name: Pytest
        run: pytest -v

  docker:
    name: Build Docker image
    # Testler geçmezse imaj derlemeye hiç başlanmaz.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sadece derlenebildiğini doğrular; registry'ye push ve deploy elle yapılır.
      - name: Build
        run: docker build -t dus-backend:ci .
