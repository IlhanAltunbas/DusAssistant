services:
  # Varsayılan kurulum canlıdaki gibi Azure AI Search kullanır; Qdrant sadece
  # "docker compose --profile qdrant up" ile ve VECTOR_STORE=qdrant iken gerekir.
  qdrant:
    image: qdrant/qdrant
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Container içinde localhost backend'in kendisidir; Qdrant'a servis adıyla ulaşılır.
      QDRANT_URL: http://qdrant:6333
    restart: unless-stopped

volumes:
  qdrant_storage:
    # Compose'un "dus-backend_qdrant_storage" adında yeni, boş bir volume açmasını engeller.
    external: true
