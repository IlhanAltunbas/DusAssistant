[pytest]
# "from app import ..." testlerde de çalışsın diye dus-backend kök dizini import yoluna eklenir.
pythonpath = .
testpaths = tests
# FastAPI 0.110'daki Starlette TestClient, httpx'in kaldırılmakta olan 'app' parametresini kullanıyor.
# Uyarı bizim kodumuzdan değil; FastAPI yükseltilince bu satır silinebilir.
filterwarnings =
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
